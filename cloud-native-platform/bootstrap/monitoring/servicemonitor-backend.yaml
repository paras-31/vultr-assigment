apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: apps
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - apps
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
